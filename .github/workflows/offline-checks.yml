name: Offline project checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight offline test dependencies
        run: python -m pip install pytest python-dotenv
      - name: Check Python syntax
        run: python -m compileall -q src tests
      - name: Test components and the shared two-run interface
        env:
          AAI520_LIVE_TESTS: '0'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q
